<aside id="default-sidebar"
  class="fixed top-0 left-0 z-40 h-screen
         transition-all duration-300 ease-in-out
         -translate-x-full lg:translate-x-0
         lg:static
         bg-white border-r border-gray-200
         w-64 sidebar-collapsed:w-20 flex flex-col"
  aria-label="Sidebar">

  <!-- HEADER -->
  <div id="sidebar-header"
       class="flex items-center justify-between px-4 py-3 border-b">

    <!-- Logo -->
    <span class="text-lg font-semibold whitespace-nowrap nav-label">
      <a href="{% url 'home' %}"
       class="flex items-center p-2 rounded-lg hover:bg-gray-100 group">
      <span class="text-xl"></span>
      <span class="ml-3 nav-label">Calvary Chapel 316</span>
    </a>
    </span>

    <!-- Desktop Collapse Button -->
    <button id="sidebarCollapseBtn"
      class="hidden lg:flex items-center justify-center w-8 h-8 rounded hover:bg-gray-100">
      ☰
    </button>
  </div>

  <!-- NAV -->
  <div class="flex-1 px-3 py-4 space-y-2 overflow-y-auto">

    <a href="{% url 'Locations:location_list' %}" class="nav-link">
      <span class="text-xl">📍</span>
      <span class="ml-3 nav-label">Locations</span>
    </a>

    <a href="{% url 'sermon_list' %}"
       class="flex items-center p-2 rounded-lg hover:bg-gray-100 group">
      <span class="text-xl">🎤</span>
      <span class="ml-3 nav-label">Sermons</span>
    </a>

    <a href="{% url 'series_list' %}"
       class="flex items-center p-2 rounded-lg hover:bg-gray-100 group">
      <span class="text-xl">📚</span>
      <span class="ml-3 nav-label">Series</span>
    </a>

    <!-- Example Dropdown (Flowbite) -->
    <button type="button"
      class="flex items-center w-full p-2 rounded-lg hover:bg-gray-100 group"
      data-collapse-toggle="dropdown-pages">
      <span class="text-xl">⚙️</span>
      <span class="flex-1 ml-3 text-left nav-label">Settings</span>
    </button>

    <ul id="dropdown-pages" class="hidden py-2 space-y-2">
      <li>
        <a href="#"
           class="flex items-center w-full p-2 pl-11 rounded-lg hover:bg-gray-100 nav-label">
          Profile
        </a>
      </li>
    </ul>

  </div>

</aside>
