{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Sermon App{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Flowbite -->
  <script src="{% static 'js/flowbite.min.js' %}"></script>
</head>

<body class="bg-gray-50">

<!-- MOBILE TOP BAR -->
<nav class="lg:hidden flex items-center justify-between p-4 bg-white border-b">
  
  <!-- Mobile Toggle (Flowbite) -->
  <button type="button"
    class="inline-flex items-center p-2 text-gray-500 rounded-lg hover:bg-gray-100"
    data-drawer-target="default-sidebar"
    data-drawer-toggle="default-sidebar">
    ☰
  </button>

  <span class="font-semibold">Sermon App</span>
</nav>

<!-- LAYOUT -->
<div class="flex">

  <!-- SIDEBAR -->
  {% include "base/sidebar.html" %}

  <!-- MAIN CONTENT -->
  <main id="main-content"
    class="flex-1 p-6 transition-all duration-300">

    {% block content %}
    {% endblock %}

  </main>

</div>

<!-- DESKTOP COLLAPSE SCRIPT -->
<script>
  const sidebar = document.getElementById('default-sidebar');
  const btn = document.getElementById('sidebarCollapseBtn');
  const labels = document.querySelectorAll('.nav-label');

  let isCollapsed = false;

  btn?.addEventListener('click', () => {
    isCollapsed = !isCollapsed;

    // Toggle width
    sidebar.classList.toggle('w-64');
    sidebar.classList.toggle('w-20');

    // Toggle label visibility
    labels.forEach(label => {
      label.classList.toggle('hidden');
    });

    // Center header when collapsed
    document.getElementById('sidebar-header')
      .classList.toggle('justify-center', isCollapsed);
  });
</script>

</body>
</html>
