{% load static tailwind_tags %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    {% tailwind_css %}

    <title>{% block head_title %}Calvary Chapel Eastern CT{% endblock %}</title>
  </head>

<body class="bg-gray-50 text-gray-900 overflow-hidden">
  <div class="flex h-screen">
    
    {% include "base/sidebar.html" %}

    <main id="main-content" class="flex-1 transition-all duration-300 h-screen overflow-y-auto p-6">
      <!-- templates/base.html (button wrapper) -->
      <div class="flex items-center gap-2 mb-4">
      <!-- Mobile toggle ONLY -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
          ☰
        </button>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>


<!-- templates/base.html (toggleSidebar function) -->
<script>
function syncSidebarState() {
  const sidebar = document.getElementById('sidebar-el');
  const texts = document.querySelectorAll('.sidebar-text');
  const navItems = document.querySelectorAll('.nav-item');

  const isDesktop = window.innerWidth >= 1024;

  if (isDesktop) {
    // ✅ FORCE DESKTOP VISIBLE
    sidebar.classList.remove('-translate-x-full');

    const isCollapsed = sidebar.classList.contains('w-20');

    if (isCollapsed) {
      texts.forEach(el => {
        el.classList.add('opacity-0');
        el.classList.add('pointer-events-none');
      });

      navItems.forEach(el => {
        el.classList.add('justify-center');
      });

    } else {
      texts.forEach(el => {
        el.classList.remove('opacity-0');
        el.classList.remove('pointer-events-none');
      });

      navItems.forEach(el => {
        el.classList.remove('justify-center');
      });
    }

  } else {
    // 📱 MOBILE DEFAULT = HIDDEN
    sidebar.classList.add('-translate-x-full');
  }
}
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar-el');
  const texts = document.querySelectorAll('.sidebar-text');
  const navItems = document.querySelectorAll('.nav-item');

  const isDesktop = window.innerWidth >= 1024;

  if (isDesktop) {
    const isCollapsed = sidebar.classList.contains('w-20');

    if (isCollapsed) {
      // 🔓 EXPAND
      sidebar.classList.remove('w-20');
      sidebar.classList.add('w-64');

      document.getElementById('sidebar-header')
        .classList.remove('justify-center');

      texts.forEach(el => {
        el.classList.remove('hidden');
      });

      navItems.forEach(el => {
        el.classList.remove('justify-center');
        el.classList.add('gap-3');
      });

    } else {
      // 🔒 COLLAPSE
      sidebar.classList.remove('w-64');
      sidebar.classList.add('w-20');

      document.getElementById('sidebar-header')
        .classList.remove('justify-center');

      texts.forEach(el => {
        el.classList.add('hidden');
      });

      navItems.forEach(el => {
        el.classList.add('justify-center');
        el.classList.remove('gap-3');
      });
    }

  } else {
    // 📱 MOBILE TOGGLE
    sidebar.classList.toggle('-translate-x-full');
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', syncSidebarState);
window.addEventListener('resize', syncSidebarState);
</script>
  </body>
</html>
