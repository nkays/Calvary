{% load static tailwind_tags %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    {% tailwind_css %}

    <title>{% block head_title %}Calvary Chapel Eastern CT{% endblock %}</title>
  </head>

<body class="bg-gray-50 text-gray-900 overflow-hidden">
  <div class="flex h-screen">
    
    {% include "base/sidebar.html" %}

    <main id="main-content" class="flex-1 transition-all duration-300 h-screen overflow-y-auto p-6">
      <!-- templates/base.html (button wrapper) -->
      <div class="flex items-center gap-2 mb-4">
      <!-- Mobile toggle ONLY -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
          ☰
        </button>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>


<!-- templates/base.html (toggleSidebar function) -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar-el');
      const labels = document.querySelectorAll('.nav-label');

      if (window.innerWidth >= 1024) {
        sidebar.classList.toggle('w-64');
        sidebar.classList.toggle('w-20');

        labels.forEach(el => {
          el.classList.toggle('opacity-0');
          el.classList.toggle('w-0');
          el.classList.toggle('overflow-hidden');
          el.classList.toggle('justify-center');
        });

        document.querySelectorAll('#sidebar-el nav a')
          .forEach(el => el.classList.toggle('justify-center'));
      } else {
        sidebar.classList.toggle('-translate-x-full');
      }
    }
  </script>
  </body>
</html>
