{% load static tailwind_tags %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    {% tailwind_css %}
    <style>
    /* Sidebar collapsed state applied before JS runs */
    .sidebar-collapsed #sidebar-el {
      width: 5rem; /* same as Tailwind w-20 */
    }
    </style>
    <title>{% block head_title %}Calvary Chapel Eastern CT{% endblock %}</title>
  </head>

<body class="bg-gray-50 text-gray-900 overflow-hidden">
  <div class="flex h-screen">
    
    {% include "base/sidebar.html" %}

    <main id="main-content" class="flex-1 transition-all duration-300 h-screen overflow-y-auto p-6">
      <!-- templates/base.html (button wrapper) -->
      <div class="flex items-center gap-2 mb-4">
      <!-- Mobile toggle ONLY -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-gray-200">
          ☰
        </button>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>


<!-- templates/base.html (toggleSidebar function) -->
<script>
const STORAGE_KEY = 'sidebarCollapsed';
const savedState = localStorage.getItem(STORAGE_KEY);

if (savedState === 'true') {
  document.documentElement.classList.add('sidebar-collapsed');
}
function syncSidebarState() {
  const sidebar = document.getElementById('sidebar-el');
  const texts = document.querySelectorAll('.sidebar-text');
  const navItems = document.querySelectorAll('.nav-item');
  const header = document.getElementById('sidebar-header');


  const isDesktop = window.innerWidth >= 1024;

  let isCollapsed;

  if (savedState !== null) {
    isCollapsed = savedState === 'true';
  } else {
    isCollapsed = true; // default
  }

  if (isDesktop) {
    sidebar.classList.remove('-translate-x-full');

    // ✅ enforce width from saved state
    if (isCollapsed) {
      sidebar.classList.remove('w-64');
      sidebar.classList.add('w-20');
    } else {
      sidebar.classList.remove('w-20');
      sidebar.classList.add('w-64');
    }

    if (isCollapsed) {
      header.classList.add('justify-center');

      texts.forEach(el => {
        el.classList.add('opacity-0', 'pointer-events-none'); // hide with fade
        el.classList.remove('opacity-100');                   // ensure opacity-100 removed
      });

      navItems.forEach(el => {
        el.classList.add('justify-center');
        el.classList.remove('gap-3');
      });

    } else {
      header.classList.remove('justify-center');

      texts.forEach(el => {
        el.classList.remove('opacity-0', 'pointer-events-none'); // fade in
        el.classList.add('opacity-100');                          // ensure fully visible
      });

      navItems.forEach(el => {
        el.classList.remove('justify-center');
        el.classList.add('gap-3');
      });
    }

  } else {
    sidebar.classList.add('-translate-x-full');
  }
}
function toggleSidebar() {
  const STORAGE_KEY = 'sidebarCollapsed';
  const sidebar = document.getElementById('sidebar-el');
  const texts = document.querySelectorAll('.sidebar-text');
  const navItems = document.querySelectorAll('.nav-item');
  const header = document.getElementById('sidebar-header');

  const isDesktop = window.innerWidth >= 1024;

  if (isDesktop) {
    const isCollapsed = sidebar.classList.contains('w-20');

    if (isCollapsed) {
      // 🔓 EXPAND
      localStorage.setItem(STORAGE_KEY, 'false');
      sidebar.classList.remove('w-20');
      sidebar.classList.add('w-64');

      header.classList.remove('justify-center');

      texts.forEach(el => {
        el.classList.remove('opacity-0', 'pointer-events-none'); // fade in
        el.classList.add('opacity-100');                          // ensure fully visible
      });

      navItems.forEach(el => {
        el.classList.remove('justify-center');
        el.classList.add('gap-3');
      });

    } else {
      // 🔒 COLLAPSE
      localStorage.setItem(STORAGE_KEY, 'true');
      sidebar.classList.remove('w-64');
      sidebar.classList.add('w-20');

      header.classList.add('justify-center');

      texts.forEach(el => {
        el.classList.add('opacity-0', 'pointer-events-none'); // hide with fade
        el.classList.remove('opacity-100');                   // ensure opacity-100 removed
      });

      navItems.forEach(el => {
        el.classList.add('justify-center');
        el.classList.remove('gap-3');
      });
    }

  } else {
    // 📱 MOBILE TOGGLE
    sidebar.classList.toggle('-translate-x-full');
  }
}
</script>
<script>
document.addEventListener('DOMContentLoaded', syncSidebarState);
window.addEventListener('resize', syncSidebarState);
</script>
  </body>
</html>
