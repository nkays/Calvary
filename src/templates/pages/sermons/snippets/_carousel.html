{% if featured_items %}
<div id="default-carousel"
     class="relative w-full mb-10"
     data-carousel="slide"
     data-carousel-interval="10000">
    <!-- Wrapper -->
    <div class="relative h-56 overflow-hidden rounded-lg md:h-96">

        {% for sermon in featured_items %}
        <div class="hidden duration-700 ease-in-out" data-carousel-item>

            <!-- Background image -->
            <img 
                src="{{ sermon.thumbnail }}" 
                class="absolute block w-full h-full object-cover "
                style= "object-position: center 28%;"
                alt="{{ sermon.title }}"
            >

            <!-- Overlay -->
            <div class="absolute inset-0 bg-black/40 flex items-end p-6">
    
                <div class="w-full flex justify-between items-end">

                    <!-- LEFT: Text -->
                    <div class="text-white max-w-lg">
                        <h2 class="text-xl md:text-2xl font-bold">
                            {{ sermon.title }}
                        </h2>
                        <p class="text-sm opacity-80">
                            {{ sermon.series.title }}
                        </p>
                    </div>

                    <!-- RIGHT: Button -->
                    <div class="ml-4">
                        <a href="{{ sermon.get_absolute_url }}"
                        class="inline-block px-4 py-2 bg-white text-black rounded-lg text-sm font-medium whitespace-nowrap">
                            Watch Sermon
                        </a>
                    </div>

                </div>

            </div>

        </div>
        {% endfor %}

    </div>

    <!-- Indicators -->
    <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3">
        {% for sermon in featured_items %}
        <button type="button"
            class="w-3 h-3 rounded-full"
            data-carousel-slide-to="{{ forloop.counter0 }}">
        </button>
        {% endfor %}
    </div>

    <!-- Controls -->
    <button type="button"
        class="absolute top-0 left-0 z-30 flex items-center justify-center h-full px-4"
        data-carousel-prev>
        ‹
    </button>

    <button type="button"
        class="absolute top-0 right-0 z-30 flex items-center justify-center h-full px-4"
        data-carousel-next>
        ›
    </button>

</div>
{% endif %}
