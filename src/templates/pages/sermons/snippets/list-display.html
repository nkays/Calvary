
<div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
    <table class="w-full text-sm text-left rtl:text-right text-body">
        <thead class="bg-neutral-secondary-soft border-b border-default">
            <tr>
                <th scope="col" class="w-24 h-16 font-medium">
                 
                </th>
                <th scope="col" class="px-6 py-3 font-medium">
                    Description
                </th>
            </tr>
        </thead>
        
        <tbody>
            {% for object in queryset %}
            <tr class="odd:bg-neutral-primary even:bg-neutral-secondary-soft border-b border-default">
                <th scope="row" class="w-24 h-16 font-medium text-heading whitespace-nowrap">
                    <img 
                        src="{{ object.thumbnail }}" 
                        alt="{{ object.title }}"
                        class="w-full h-48 object-cover"
                    >
                </th>
                <td class="px-6 py-4">
                    {{ object.description }}
                </td>
                <td class="px-6 py-4">
                    <a href="{{ object.get_absolute_url }}" class="font-medium text-fg-brand hover:underline">Watch Now </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
