{% extends "base/tail.html" %}

{% block content %}
<div class="max-w-5xl mx-auto px-4 py-10">

  <!-- Page Title -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">{{ page_title }}</h1>
    <p class="text-gray-500 mt-1">{{ page_subtitle }}</p>
  </div>

  <!-- List -->
  <div class="space-y-6">

    {% for item in object_list %}
      {% include "pages/sermons/snippets/_card.html" with item=item type=object_type %}
    {% empty %}
      <p class="text-center text-gray-500 py-10">
        No {{ object_type }} available yet.
      </p>
    {% endfor %}

  </div>
</div>
{% endblock %}
